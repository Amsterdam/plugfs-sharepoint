repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uvx ruff check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format
        entry: uvx ruff format --check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: Ty check
        entry: uvx ruff format --check src tests
        language: system
        pass_filenames: false
        always_run: true

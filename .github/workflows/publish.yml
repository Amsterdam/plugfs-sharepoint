name: Publish to PyPI

on:
  release:
    types:
      - released

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish
